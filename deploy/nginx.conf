# /etc/nginx/sites-available/chronum
# Шаблон боевого конфига с HTTPS. install.sh подставляет:
#   __SERVER_NAMES__ — домен и, если он корневой, www-версия
#   __CERT_DOMAIN__  — основной домен (пути к сертификату и цель редиректа)
# и раскомментирует строки сертификата после выпуска.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # Для проверки и продления Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://__CERT_DOMAIN__$request_uri;
    }
}

server {
    # Форма с http2 в listen понимается и nginx 1.24 (Ubuntu 24.04), и более новыми.
    # Отдельная директива «http2 on;» появилась только в 1.25 — её здесь быть не должно.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAMES__;

    # Эти строки раскомментирует install.sh после выпуска сертификата.
    # ssl_certificate     /etc/letsencrypt/live/__CERT_DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__CERT_DOMAIN__/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # www и любые другие имена сводим к основному домену
    if ($host != __CERT_DOMAIN__) {
        return 301 https://__CERT_DOMAIN__$request_uri;
    }

    # Файлы, фото, аудио — до 50 МБ (совпадает с MAX_UPLOAD_MB)
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
