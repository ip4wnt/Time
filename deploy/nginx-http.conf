# Вариант без домена и HTTPS: доступ по IP на 80-м порту.
# Используется install.sh, если переменная DOMAIN не задана.
# Как только появится домен — перезапустите install.sh с DOMAIN и EMAIL.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 55m;

    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy и Permissions-Policy
    # выставляет само приложение — дублировать их здесь нельзя, иначе браузер
    # получает два разных X-Frame-Options.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
