<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Трекер времени</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* base.css */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: none;
  text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  hanging-punctuation: first last;
}

body {
  min-height: 100dvh;
  line-height: 1.5;
  font-family: var(--font-body, sans-serif);
  font-size: var(--text-base);
  color: var(--color-text);
  background-color: var(--color-bg);
  overscroll-behavior-y: none;
}

img,
picture,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
  height: auto;
}
ul[role='list'],
ol[role='list'] {
  list-style: none;
}
input,
button,
textarea,
select {
  font: inherit;
  color: inherit;
}

h1,
h2,
h3,
h4,
h5,
h6 {
  text-wrap: balance;
  line-height: 1.15;
}
p,
li {
  text-wrap: pretty;
}

::selection {
  background: color-mix(in oklab, var(--color-primary) 30%, transparent);
  color: var(--color-text);
}

:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

button {
  cursor: pointer;
  background: none;
  border: none;
}

a,
button,
[role='button'],
input,
textarea,
select {
  transition:
    color var(--transition-interactive),
    background var(--transition-interactive),
    border-color var(--transition-interactive),
    box-shadow var(--transition-interactive),
    transform var(--transition-interactive);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}


:root {
  /* Type scale */
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.0625rem);
  --text-lg: clamp(1.125rem, 1rem + 0.5vw, 1.375rem);
  --text-xl: clamp(1.5rem, 1.3rem + 1vw, 2rem);

  /* Spacing (4px base) */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  /* Surfaces & text (dark-first, matches mockups) */
  --color-bg: #1a1a1a;
  --color-surface: #201f1f;
  --color-surface-2: #262626;
  --color-surface-offset: #2c2c2c;
  --color-divider: #333333;
  --color-border: #3a3a3a;

  --color-text: #f2f1ee;
  --color-text-muted: #a3a19c;
  --color-text-faint: #6e6c68;
  --color-text-inverse: #1a1a1a;

  --color-primary: #6bc98a;
  --color-primary-hover: #58b077;

  --radius-sm: 0.375rem;
  --radius-md: 0.625rem;
  --radius-lg: 0.875rem;
  --radius-xl: 1.25rem;
  --radius-full: 9999px;

  --transition-interactive: 160ms cubic-bezier(0.16, 1, 0.3, 1);

  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-md: 0 8px 24px oklch(0 0 0 / 0.4);
  --shadow-lg: 0 16px 48px oklch(0 0 0 / 0.55);

  --font-display: 'Manrope', 'Segoe UI', sans-serif;
  --font-body: 'Manrope', 'Segoe UI', sans-serif;

  /* --- The 9 tracking colors (from mockups) --- */
  --c-sleep: #363636;      /* сон — игнорируется при оценке дня */
  --c-green: #7bd694;
  --c-darkgray: #4a4a4a;
  --c-white: #f5f5f0;
  --c-blue: #5b7fc4;
  --c-purple: #3a1361;
  --c-pink: #ef8fc0;
  --c-red: #c62c22;
  --c-olive: #a5872e;
}

@media (color-gamut: p3) {
  :root {
    --color-primary: oklch(0.78 0.13 152);
  }
}

/* ===== Layout shell ===== */

html,
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-bg);
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  max-width: 480px;
  margin-inline: auto;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: var(--space-6) var(--space-5) var(--space-4);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transition:
    transform var(--transition-interactive),
    opacity var(--transition-interactive);
}

.screen[hidden] {
  display: none;
}

/* ===== Day view header ===== */

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-6);
  gap: var(--space-2);
}

.day-header .nav-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-full);
  color: var(--color-text-muted);
  flex: none;
}

.day-header .nav-btn:hover {
  background: var(--color-surface-2);
  color: var(--color-text);
}

.day-header .nav-btn:active {
  transform: scale(0.92);
}

.day-title {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  user-select: none;
}

.day-title .num {
  font-size: var(--text-xl);
  font-weight: 800;
  letter-spacing: -0.01em;
}

.day-title .mon {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  text-transform: lowercase;
}

.day-title .dow {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ===== Hour grid (Day view) ===== */

.hour-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--space-2);
}

.hour-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-md);
  background: var(--color-surface-offset);
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  padding: var(--space-2);
  overflow: hidden;
  border: 2px solid transparent;
}

.hour-cell .hour-label {
  font-size: var(--text-xs);
  font-weight: 700;
  color: rgba(0, 0, 0, 0.55);
  line-height: 1;
}

.hour-cell.is-light .hour-label {
  color: rgba(0, 0, 0, 0.5);
}
.hour-cell.is-dark .hour-label {
  color: rgba(255, 255, 255, 0.75);
}
.hour-cell.is-empty .hour-label {
  color: var(--color-text-faint);
}

.hour-cell.is-selected {
  border-color: var(--color-text);
  box-shadow: 0 0 0 2px var(--color-bg) inset;
}

.hour-cell:active {
  transform: scale(0.96);
}

.hour-cell.has-note::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  color: rgba(0, 0, 0, 0.4);
}
.hour-cell.is-dark.has-note::after {
  color: rgba(255, 255, 255, 0.7);
}

/* ===== Day notes summary ===== */

.day-notes {
  margin-top: var(--space-6);
  font-size: var(--text-sm);
  line-height: 1.6;
  color: var(--color-text-muted);
  white-space: pre-wrap;
}

.day-notes .note-entry {
  margin-bottom: var(--space-2);
}

.day-notes .note-entry .range {
  color: var(--color-text);
  font-weight: 700;
}

.day-notes.empty {
  color: var(--color-text-faint);
  font-style: italic;
}

.day-hint {
  margin-top: auto;
  padding-top: var(--space-6);
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-text-faint);
}

/* ===== Month view ===== */

.month-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.month-header .nav-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-full);
  color: var(--color-text-muted);
}
.month-header .nav-btn:hover {
  background: var(--color-surface-2);
  color: var(--color-text);
}
.month-header .nav-btn:active {
  transform: scale(0.92);
}

.month-title {
  font-size: var(--text-xl);
  font-weight: 800;
  text-transform: lowercase;
  min-width: 7ch;
  text-align: center;
}

.weekday-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

.weekday-row span {
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-2);
}

.month-cell {
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-md);
  background: var(--color-surface-offset);
  display: grid;
  place-items: center;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-text);
  position: relative;
}

.month-cell.is-light {
  color: rgba(0, 0, 0, 0.6);
}
.month-cell.is-dark {
  color: rgba(255, 255, 255, 0.85);
}
.month-cell.is-empty {
  color: var(--color-text-faint);
  font-weight: 600;
}
.month-cell.is-outside {
  visibility: hidden;
}

.month-cell.is-today {
  box-shadow: 0 0 0 2px var(--color-primary) inset;
}

.month-cell:active {
  transform: scale(0.94);
}

/* ===== Month notes summary ===== */

.month-notes {
  margin-top: var(--space-6);
  font-size: var(--text-sm);
  line-height: 1.65;
  color: var(--color-text-muted);
}

.month-notes .day-block {
  margin-bottom: var(--space-4);
}

.month-notes .day-block .day-num {
  color: var(--color-text);
  font-weight: 800;
  margin-right: var(--space-2);
}

.month-notes.empty {
  color: var(--color-text-faint);
  font-style: italic;
}

/* ===== Selection confirm bar (Day view multi-select) ===== */

.selection-bar {
  position: fixed;
  left: 50%;
  bottom: var(--space-6);
  transform: translateX(-50%);
  width: calc(100% - var(--space-8));
  max-width: 420px;
  background: var(--color-surface-offset);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  box-shadow: var(--shadow-lg);
  z-index: 40;
}

.selection-bar[hidden] {
  display: none;
}

.selection-bar span {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-text);
  white-space: nowrap;
}

.selection-bar-actions {
  display: flex;
  gap: var(--space-2);
}

.selection-bar-actions .btn {
  flex: none;
  padding: var(--space-2) var(--space-4);
}

/* ===== Bottom actions (Month view) ===== */

.month-actions {
  margin-top: auto;
  padding-top: var(--space-8);
  display: flex;
  justify-content: center;
  gap: var(--space-10);
}

.icon-btn {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-full);
  display: grid;
  place-items: center;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
}

.icon-btn:hover {
  color: var(--color-text);
  background: var(--color-surface-offset);
}

.icon-btn:active {
  transform: scale(0.92);
}

/* ===== Color palette sheet ===== */

.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-interactive);
}

.sheet-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--color-surface);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: var(--space-6) var(--space-5) var(--space-8);
  transform: translateY(100%);
  transition: transform var(--transition-interactive);
  box-shadow: var(--shadow-lg);
  max-height: 85vh;
  overflow-y: auto;
}

.sheet-overlay.is-open .sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 40px;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--color-border);
  margin: 0 auto var(--space-5);
}

.sheet-title {
  font-size: var(--text-base);
  font-weight: 700;
  margin-bottom: var(--space-4);
  color: var(--color-text);
}

.sheet-title .sub {
  display: block;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-faint);
  margin-top: 2px;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--space-3);
  margin-bottom: var(--space-5);
}

.palette-swatch {
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-md);
  border: 2px solid transparent;
  position: relative;
}

.palette-swatch.is-active {
  border-color: var(--color-text);
}

.palette-swatch .check {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  color: rgba(0, 0, 0, 0.65);
}
.palette-swatch.is-dark .check {
  color: rgba(255, 255, 255, 0.85);
}
.palette-swatch.is-active .check {
  display: flex;
}

.palette-swatch.clear-swatch {
  background: var(--color-surface-offset) !important;
  display: grid;
  place-items: center;
  color: var(--color-text-faint);
  font-size: var(--text-xs);
}

.note-field {
  width: 100%;
  min-height: 84px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-text);
  resize: vertical;
  margin-bottom: var(--space-5);
}

.note-field::placeholder {
  color: var(--color-text-faint);
}

.sheet-actions {
  display: flex;
  gap: var(--space-3);
}

.btn {
  flex: 1;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 700;
  text-align: center;
}

.btn-primary {
  background: var(--color-primary);
  color: #0e1f14;
}
.btn-primary:hover {
  background: var(--color-primary-hover);
}
.btn-primary:active {
  transform: scale(0.97);
}

.btn-ghost {
  background: var(--color-surface-2);
  color: var(--color-text-muted);
}
.btn-ghost:hover {
  color: var(--color-text);
  background: var(--color-surface-offset);
}
.btn-ghost:active {
  transform: scale(0.97);
}

/* ===== Toast ===== */

.toast {
  position: fixed;
  bottom: var(--space-8);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--color-surface-offset);
  color: var(--color-text);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-full);
  font-size: var(--text-sm);
  font-weight: 600;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: all var(--transition-interactive);
  z-index: 100;
  max-width: 90%;
  text-align: center;
}

.toast.is-open {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== Hidden file input ===== */

.visually-hidden-input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
}

/* ===== Responsive ===== */

@media (min-width: 480px) {
  #app {
    border-inline: 1px solid var(--color-divider);
  }
}

@media (max-width: 340px) {
  .palette-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

</style>
</head>
<body>
  <div id="app">

    <!-- ===================== MONTH VIEW ===================== -->
    <section class="screen" id="screen-month">
      <div class="month-header">
        <button class="nav-btn" id="month-prev" aria-label="Предыдущий месяц">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 class="month-title" id="month-title">сен</h1>
        <button class="nav-btn" id="month-next" aria-label="Следующий месяц">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="weekday-row">
        <span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span>
      </div>

      <div class="month-grid" id="month-grid" role="grid" aria-label="Календарь месяца"></div>

      <div class="month-notes" id="month-notes"></div>

      <div class="month-actions">
        <button class="icon-btn" id="btn-export" aria-label="Экспорт данных в файл">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        </button>
        <button class="icon-btn" id="btn-import" aria-label="Импорт данных из файла">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M12 16l-4-4M12 16l4-4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        </button>
        <input type="file" id="import-input" class="visually-hidden-input" accept=".json,application/json" />
      </div>
    </section>

    <!-- ===================== DAY VIEW ===================== -->
    <section class="screen" id="screen-day" hidden>
      <div class="day-header">
        <button class="nav-btn" id="day-prev" aria-label="Предыдущий день">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="day-title" id="day-title-btn">
          <span class="dow" id="day-dow">ВС</span>
          <span class="num" id="day-num">14</span>
          <span class="mon" id="day-mon">сен</span>
        </div>
        <button class="nav-btn" id="day-next" aria-label="Следующий день">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="hour-grid" id="hour-grid" role="grid" aria-label="Часы дня"></div>

      <div class="day-notes" id="day-notes"></div>

      <div class="day-hint" id="day-hint">Свайп вправо — вернуться к месяцу</div>
    </section>

    <div class="selection-bar" id="selection-bar" hidden>
      <span id="selection-count">Выбрано часов: 0</span>
      <div class="selection-bar-actions">
        <button class="btn btn-ghost" id="selection-cancel">Отмена</button>
        <button class="btn btn-primary" id="selection-confirm">Задать цвет</button>
      </div>
    </div>

    <!-- ===================== COLOR / NOTE SHEET ===================== -->
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheet-title">
          Час
          <span class="sub" id="sheet-subtitle"></span>
        </div>

        <div class="palette-grid" id="palette-grid"></div>

        <textarea
          class="note-field"
          id="note-field"
          placeholder="Что происходило в это время?"
          maxlength="600"
        ></textarea>

        <div class="sheet-actions">
          <button class="btn btn-ghost" id="sheet-cancel">Отмена</button>
          <button class="btn btn-primary" id="sheet-save">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
'use strict';

/* =========================================================================
   ДАННЫЕ И ХРАНИЛИЩЕ (IndexedDB)
   Структура: база "TimeTrackerDB" -> store "years"
   Запись в сторе: { year: 2026, days: [ {...}, {...}, ... 365/366 штук ] }
   Каждый день: { doy: 1..366, hours: [24 x {color: 'green'|null, noteId: n|null}],
                  notes: { [noteId]: { text: '', hours: [h1,h2,...] } }, nextNoteId: 1 }
   ========================================================================= */

const DB_NAME = 'TimeTrackerDB';
const DB_VERSION = 1;
const STORE = 'years';

const COLORS = [
  { id: 'green', hex: '#7bd694', label: 'Зелёный', dark: false },
  { id: 'sleep', hex: '#363636', label: 'Сон', dark: true },
  { id: 'darkgray', hex: '#4a4a4a', label: 'Тёмно-серый', dark: true },
  { id: 'white', hex: '#f5f5f0', label: 'Белый', dark: false },
  { id: 'blue', hex: '#5b7fc4', label: 'Синий', dark: true },
  { id: 'purple', hex: '#3a1361', label: 'Фиолетовый', dark: true },
  { id: 'pink', hex: '#ef8fc0', label: 'Розовый', dark: false },
  { id: 'red', hex: '#c62c22', label: 'Красный', dark: true },
  { id: 'olive', hex: '#a5872e', label: 'Оливковый', dark: false },
];
const COLOR_MAP = Object.fromEntries(COLORS.map((c) => [c.id, c]));
const SLEEP_ID = 'sleep';

const MONTH_NAMES = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTH_NAMES_FULL = [
  'январь', 'февраль', 'март', 'апрель', 'май', 'июнь',
  'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь',
];
const DOW_NAMES = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];

/* ---------- IndexedDB helpers ---------- */

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('IndexedDB недоступен в этом браузере'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'year' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function dbGetYear(year) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const store = tx.objectStore(STORE);
    const req = store.get(year);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function dbPutYear(yearRecord) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    store.put(yearRecord);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGetAllYears() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const store = tx.objectStore(STORE);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbClearAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------- Date helpers ---------- */

function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function daysInYear(y) {
  return isLeapYear(y) ? 366 : 365;
}

function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 1);
  return Math.floor((date - start) / 86400000) + 1;
}

function dateFromDOY(year, doy) {
  const d = new Date(year, 0, 1);
  d.setDate(doy);
  return d;
}

function daysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function makeEmptyDay(doy) {
  return {
    doy,
    hours: Array.from({ length: 24 }, () => ({ color: null, noteId: null })),
    notes: {},
    nextNoteId: 1,
  };
}

function makeEmptyYear(year) {
  const n = daysInYear(year);
  return {
    year,
    days: Array.from({ length: n }, (_, i) => makeEmptyDay(i + 1)),
  };
}

/* ---------- App state ---------- */

const state = {
  yearData: null, // currently loaded year record
  currentYear: new Date().getFullYear(),
  monthCursor: new Date().getMonth(), // month shown in month view
  monthCursorYear: new Date().getFullYear(),
  currentDOY: dayOfYear(new Date()), // day shown in day view
  currentDayYear: new Date().getFullYear(),
  selection: [], // array of hour indices currently selected in sheet
  multiSelectMode: false, // true once long-press activates multi-select
};

async function ensureYearLoaded(year) {
  if (state.yearData && state.yearData.year === year) return state.yearData;
  let rec = await dbGetYear(year);
  if (!rec) {
    rec = makeEmptyYear(year);
    await dbPutYear(rec);
  }
  // migration safety: if day count mismatches (leap year edge), pad
  const expected = daysInYear(year);
  if (rec.days.length < expected) {
    for (let i = rec.days.length; i < expected; i++) {
      rec.days.push(makeEmptyDay(i + 1));
    }
  }
  state.yearData = rec;
  return rec;
}

async function saveCurrentYear() {
  if (state.yearData) {
    await dbPutYear(state.yearData);
  }
}

function getDay(year, doy) {
  if (!state.yearData || state.yearData.year !== year) return null;
  return state.yearData.days[doy - 1] || null;
}

/* =========================================================================
   РЕНДЕР: ПРЕДСТАВЛЕНИЕ "ДЕНЬ"
   ========================================================================= */

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

const screenMonth = $('#screen-month');
const screenDay = $('#screen-day');
const hourGrid = $('#hour-grid');
const dayNotesEl = $('#day-notes');

function pad2(n) {
  return String(n).padStart(2, '0');
}

function renderDayHeader() {
  const date = dateFromDOY(state.currentDayYear, state.currentDOY);
  $('#day-num').textContent = date.getDate();
  $('#day-mon').textContent = MONTH_NAMES[date.getMonth()];
  $('#day-dow').textContent = DOW_NAMES[date.getDay()];
}

function cellShadeClass(colorId) {
  if (!colorId) return 'is-empty';
  const c = COLOR_MAP[colorId];
  return c.dark ? 'is-dark' : 'is-light';
}

async function renderDayGrid() {
  await ensureYearLoaded(state.currentDayYear);
  const day = getDay(state.currentDayYear, state.currentDOY) || makeEmptyDay(state.currentDOY);

  hourGrid.innerHTML = '';
  for (let h = 0; h < 24; h++) {
    const hourData = day.hours[h] || { color: null, noteId: null };
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'hour-cell ' + cellShadeClass(hourData.color);
    cell.dataset.hour = String(h);
    cell.setAttribute('aria-label', `${h}:00 — ${hourData.color ? COLOR_MAP[hourData.color].label : 'не отмечено'}`);
    if (hourData.color) {
      cell.style.background = COLOR_MAP[hourData.color].hex;
    }
    if (hourData.noteId != null) cell.classList.add('has-note');
    if (state.selection.includes(h)) cell.classList.add('is-selected');

    const label = document.createElement('span');
    label.className = 'hour-label';
    label.textContent = h;
    cell.appendChild(label);

    attachHourCellEvents(cell, h);
    hourGrid.appendChild(cell);
  }

  renderDayNotesSummary(day);
}

function renderDayNotesSummary(day) {
  const noteIds = Object.keys(day.notes || {});
  if (!noteIds.length) {
    dayNotesEl.innerHTML = '';
    dayNotesEl.classList.add('empty');
    dayNotesEl.textContent = 'Пока нет заметок. Нажмите на час, чтобы добавить.';
    return;
  }
  dayNotesEl.classList.remove('empty');

  // Sort notes by first hour they apply to
  const entries = noteIds
    .map((id) => day.notes[id])
    .filter((n) => n && n.text && n.text.trim() && n.hours && n.hours.length)
    .sort((a, b) => Math.min(...a.hours) - Math.min(...b.hours));

  if (!entries.length) {
    dayNotesEl.classList.add('empty');
    dayNotesEl.textContent = 'Пока нет заметок. Нажмите на час, чтобы добавить.';
    return;
  }

  dayNotesEl.innerHTML = entries
    .map((n) => {
      const hrs = [...n.hours].sort((a, b) => a - b);
      const rangeLabel = formatHourRangeLabel(hrs);
      return `<div class="note-entry"><span class="range">${rangeLabel}</span> ${escapeHTML(n.text.trim())}</div>`;
    })
    .join('');
}

function formatHourRangeLabel(sortedHours) {
  // Group consecutive runs for display, e.g. "13" or "18–21"
  const groups = [];
  let start = sortedHours[0];
  let prev = sortedHours[0];
  for (let i = 1; i <= sortedHours.length; i++) {
    const h = sortedHours[i];
    if (h === prev + 1) {
      prev = h;
      continue;
    }
    groups.push([start, prev]);
    start = h;
    prev = h;
  }
  return groups.map(([a, b]) => (a === b ? `${a}` : `${a}–${b + 1}`)).join(', ');
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Hour cell interaction (tap / long-press) ---------- */

let longPressTimer = null;
let longPressFired = false;
const LONG_PRESS_MS = 420;

function attachHourCellEvents(cell, hourIndex) {
  const start = (e) => {
    longPressFired = false;
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      state.multiSelectMode = true;
      toggleSelection(hourIndex);
      if (navigator.vibrate) navigator.vibrate(12);
      renderDayGrid();
      updateSelectionBar();
    }, LONG_PRESS_MS);
  };
  const cancel = () => {
    clearTimeout(longPressTimer);
  };
  const end = (e) => {
    clearTimeout(longPressTimer);
    if (longPressFired) return;
    // Simple tap
    if (state.multiSelectMode) {
      // already in multi-select mode -> tapping toggles membership
      toggleSelection(hourIndex);
      renderDayGrid();
      updateSelectionBar();
    } else {
      state.selection = [hourIndex];
      openHourSheet();
    }
  };

  cell.addEventListener('touchstart', start, { passive: true });
  cell.addEventListener('touchend', end);
  cell.addEventListener('touchmove', cancel);
  cell.addEventListener('touchcancel', cancel);

  cell.addEventListener('mousedown', start);
  cell.addEventListener('mouseup', end);
  cell.addEventListener('mouseleave', cancel);
}

function toggleSelection(hourIndex) {
  const idx = state.selection.indexOf(hourIndex);
  if (idx >= 0) {
    state.selection.splice(idx, 1);
  } else {
    state.selection.push(hourIndex);
  }
}

function updateSelectionBar() {
  const bar = $('#selection-bar');
  const hint = $('#day-hint');
  if (state.multiSelectMode && state.selection.length > 0) {
    bar.hidden = false;
    if (hint) hint.style.visibility = 'hidden';
    $('#selection-count').textContent = `Выбрано часов: ${state.selection.length}`;
  } else {
    bar.hidden = true;
    if (hint) hint.style.visibility = 'visible';
  }
}

function exitMultiSelect() {
  state.multiSelectMode = false;
  state.selection = [];
  updateSelectionBar();
  renderDayGrid();
}

$('#selection-cancel').addEventListener('click', exitMultiSelect);
$('#selection-confirm').addEventListener('click', () => {
  if (state.selection.length === 0) return;
  openHourSheet();
});

/* =========================================================================
   ЦВЕТОВАЯ ПАЛИТРА / ЛИСТ ВЫБОРА
   ========================================================================= */

const sheetOverlay = $('#sheet-overlay');
const sheetSubtitle = $('#sheet-subtitle');
const paletteGrid = $('#palette-grid');
const noteField = $('#note-field');

let pendingColorId = null; // color chosen in current sheet session (before save)

function buildPaletteGrid() {
  paletteGrid.innerHTML = '';
  COLORS.forEach((c) => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'palette-swatch' + (c.dark ? ' is-dark' : '');
    sw.style.background = c.hex;
    sw.dataset.color = c.id;
    sw.setAttribute('aria-label', c.label);
    sw.innerHTML = `<span class="check"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>`;
    sw.addEventListener('click', () => {
      pendingColorId = pendingColorId === c.id ? null : c.id;
      updatePaletteActiveState();
    });
    paletteGrid.appendChild(sw);
  });

  const clearSw = document.createElement('button');
  clearSw.type = 'button';
  clearSw.className = 'palette-swatch clear-swatch';
  clearSw.dataset.color = '';
  clearSw.textContent = 'Очистить';
  clearSw.addEventListener('click', () => {
    pendingColorId = null;
    updatePaletteActiveState();
  });
  paletteGrid.appendChild(clearSw);
}

function updatePaletteActiveState() {
  $$('.palette-swatch').forEach((sw) => {
    const isActive = sw.dataset.color === (pendingColorId || '');
    sw.classList.toggle('is-active', isActive && sw.dataset.color !== '');
  });
}

function openHourSheet() {
  const day = getDay(state.currentDayYear, state.currentDOY);
  const hrs = [...state.selection].sort((a, b) => a - b);

  sheetSubtitle.textContent =
    hrs.length === 1 ? `${hrs[0]}:00 – ${hrs[0] + 1}:00` : `${formatHourRangeLabel(hrs)} ч`;

  // Determine current color if uniform across selection, and existing note text if shared
  const colorsInSel = new Set(hrs.map((h) => day.hours[h].color));
  pendingColorId = colorsInSel.size === 1 ? [...colorsInSel][0] : null;
  updatePaletteActiveState();

  // If all selected hours share the exact same noteId, prefill text
  const noteIds = new Set(hrs.map((h) => day.hours[h].noteId));
  if (noteIds.size === 1 && [...noteIds][0] != null) {
    const note = day.notes[[...noteIds][0]];
    noteField.value = note ? note.text : '';
  } else {
    noteField.value = '';
  }

  sheetOverlay.classList.add('is-open');
}

function closeSheet() {
  sheetOverlay.classList.remove('is-open');
  state.selection = [];
  state.multiSelectMode = false;
  updateSelectionBar();
  renderDayGrid();
}

async function saveSheet() {
  const day = getDay(state.currentDayYear, state.currentDOY);
  const hrs = [...state.selection].sort((a, b) => a - b);
  const text = noteField.value.trim();

  // Remove these hours from any note groups they previously belonged to
  hrs.forEach((h) => {
    const oldNoteId = day.hours[h].noteId;
    if (oldNoteId != null && day.notes[oldNoteId]) {
      day.notes[oldNoteId].hours = day.notes[oldNoteId].hours.filter((x) => x !== h);
      if (day.notes[oldNoteId].hours.length === 0) delete day.notes[oldNoteId];
    }
  });

  if (pendingColorId === null) {
    // Clearing color entirely
    hrs.forEach((h) => {
      day.hours[h].color = null;
      day.hours[h].noteId = null;
    });
  } else {
    let noteId = null;
    if (text) {
      noteId = day.nextNoteId++;
      day.notes[noteId] = { text, hours: [...hrs] };
    }
    hrs.forEach((h) => {
      day.hours[h].color = pendingColorId;
      day.hours[h].noteId = noteId;
    });
  }

  await saveCurrentYear();
  closeSheet();
  showToast('Сохранено');
}

$('#sheet-cancel').addEventListener('click', closeSheet);
$('#sheet-save').addEventListener('click', saveSheet);
sheetOverlay.addEventListener('click', (e) => {
  if (e.target === sheetOverlay) closeSheet();
});

/* =========================================================================
   ПРЕДСТАВЛЕНИЕ "МЕСЯЦ"
   ========================================================================= */

const monthTitle = $('#month-title');
const monthGrid = $('#month-grid');
const monthNotesEl = $('#month-notes');

function computeDayColor(day) {
  // Count colored hours per color, ignoring sleep, ignoring empty
  const counts = {};
  for (let h = 0; h < 24; h++) {
    const c = day.hours[h].color;
    if (!c || c === SLEEP_ID) continue;
    counts[c] = (counts[c] || 0) + 1;
  }
  let best = null;
  let bestCount = 0;
  for (const [c, n] of Object.entries(counts)) {
    if (n > bestCount) {
      best = c;
      bestCount = n;
    }
  }
  return best; // null if no non-sleep colored hours
}

function findLongRunsForMonth(day) {
  // Find runs of >3 consecutive hours of the same color (excluding sleep),
  // and collect associated note texts (deduped by noteId) for that run.
  const runs = [];
  let h = 0;
  while (h < 24) {
    const color = day.hours[h].color;
    if (!color || color === SLEEP_ID) {
      h++;
      continue;
    }
    let end = h;
    while (end + 1 < 24 && day.hours[end + 1].color === color) end++;
    const length = end - h + 1;
    if (length > 3) {
      runs.push({ start: h, end, color });
    }
    h = end + 1;
  }

  // Collect distinct note texts touched by these runs
  const seenNoteIds = new Set();
  const texts = [];
  runs.forEach((run) => {
    for (let h2 = run.start; h2 <= run.end; h2++) {
      const noteId = day.hours[h2].noteId;
      if (noteId != null && !seenNoteIds.has(noteId)) {
        seenNoteIds.add(noteId);
        const note = day.notes[noteId];
        if (note && note.text && note.text.trim()) {
          texts.push(note.text.trim());
        }
      }
    }
  });
  return texts;
}

async function renderMonthView() {
  const year = state.monthCursorYear;
  const month = state.monthCursor;
  await ensureYearLoaded(year);

  monthTitle.textContent = MONTH_NAMES[month];

  const firstOfMonth = new Date(year, month, 1);
  // JS getDay(): 0=Sun..6=Sat. We want Monday-first index: 0=Mon..6=Sun
  const jsDow = firstOfMonth.getDay();
  const mondayFirstOffset = (jsDow + 6) % 7;
  const totalDays = daysInMonth(year, month);

  monthGrid.innerHTML = '';

  // Leading days from previous month (shown, muted, non-interactive but numbered like mockup)
  const prevMonthDays = daysInMonth(year, month === 0 ? 11 : month - 1);
  for (let i = 0; i < mondayFirstOffset; i++) {
    const dayNum = prevMonthDays - mondayFirstOffset + i + 1;
    const cell = document.createElement('div');
    cell.className = 'month-cell is-empty';
    cell.textContent = dayNum;
    cell.style.opacity = '0.35';
    monthGrid.appendChild(cell);
  }

  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
  const monthNoteBlocks = [];

  for (let d = 1; d <= totalDays; d++) {
    const dateObj = new Date(year, month, d);
    const doy = dayOfYear(dateObj);
    const day = getDay(year, doy) || makeEmptyDay(doy);

    const colorId = computeDayColor(day);
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'month-cell ' + (colorId ? cellShadeClass(colorId) : 'is-empty');
    if (colorId) cell.style.background = COLOR_MAP[colorId].hex;
    if (isCurrentMonth && d === today.getDate()) cell.classList.add('is-today');
    cell.textContent = d;
    cell.dataset.doy = String(doy);
    cell.addEventListener('click', () => openDayFromMonth(year, doy));
    monthGrid.appendChild(cell);

    const texts = findLongRunsForMonth(day);
    if (texts.length) {
      monthNoteBlocks.push({ day: d, texts });
    }
  }

  // Trailing days from next month to fill final row
  const totalCells = mondayFirstOffset + totalDays;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    const cell = document.createElement('div');
    cell.className = 'month-cell is-empty';
    cell.textContent = i;
    cell.style.opacity = '0.35';
    monthGrid.appendChild(cell);
  }

  renderMonthNotes(monthNoteBlocks);
}

function renderMonthNotes(blocks) {
  if (!blocks.length) {
    monthNotesEl.classList.add('empty');
    monthNotesEl.textContent = 'Нет продолжительных занятий (>3ч подряд) в этом месяце.';
    return;
  }
  monthNotesEl.classList.remove('empty');
  monthNotesEl.innerHTML = blocks
    .map(
      (b) =>
        `<div class="day-block"><span class="day-num">${b.day}</span>${b.texts.map(escapeHTML).join(' · ')}</div>`
    )
    .join('');
}

function openDayFromMonth(year, doy) {
  state.currentDayYear = year;
  state.currentDOY = doy;
  showScreen('day');
}

$('#month-prev').addEventListener('click', () => {
  state.monthCursor--;
  if (state.monthCursor < 0) {
    state.monthCursor = 11;
    state.monthCursorYear--;
  }
  renderMonthView();
});

$('#month-next').addEventListener('click', () => {
  state.monthCursor++;
  if (state.monthCursor > 11) {
    state.monthCursor = 0;
    state.monthCursorYear++;
  }
  renderMonthView();
});

/* =========================================================================
   НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ (день / месяц)
   ========================================================================= */

function showScreen(name) {
  if (name === 'day') {
    screenMonth.hidden = true;
    screenDay.hidden = false;
    state.selection = [];
    state.multiSelectMode = false;
    updateSelectionBar();
    renderDayHeader();
    renderDayGrid();
  } else {
    screenDay.hidden = true;
    screenMonth.hidden = false;
    // Sync month cursor to whichever day we came from
    const date = dateFromDOY(state.currentDayYear, state.currentDOY);
    state.monthCursor = date.getMonth();
    state.monthCursorYear = date.getFullYear();
    renderMonthView();
  }
}

$('#day-prev').addEventListener('click', () => shiftDay(-1));
$('#day-next').addEventListener('click', () => shiftDay(1));
$('#day-title-btn').addEventListener('click', () => showScreen('month'));

async function shiftDay(delta) {
  let doy = state.currentDOY + delta;
  let year = state.currentDayYear;
  const max = daysInYear(year);
  if (doy < 1) {
    year -= 1;
    await ensureYearLoaded(year);
    doy = daysInYear(year);
  } else if (doy > max) {
    year += 1;
    doy = 1;
  }
  state.currentDayYear = year;
  state.currentDOY = doy;
  await ensureYearLoaded(year);
  renderDayHeader();
  renderDayGrid();
}

/* Swipe gesture: swipe right on day screen -> go to month view */
(function setupSwipe() {
  let touchStartX = null;
  let touchStartY = null;

  screenDay.addEventListener(
    'touchstart',
    (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    },
    { passive: true }
  );

  screenDay.addEventListener(
    'touchend',
    (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const sheetOpen = sheetOverlay.classList.contains('is-open');
      if (dx > 80 && Math.abs(dy) < 60 && !state.multiSelectMode && !sheetOpen) {
        showScreen('month');
      }
      touchStartX = null;
      touchStartY = null;
    },
    { passive: true }
  );
})();

/* =========================================================================
   ЭКСПОРТ / ИМПОРТ JSON
   ========================================================================= */

async function exportAllData() {
  const years = await dbGetAllYears();
  const exportObj = {
    appName: 'Трекер времени',
    exportedAt: new Date().toISOString(),
    version: 1,
    years,
  };
  const json = JSON.stringify(exportObj, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `time-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Файл сохранён');
}

async function importAllData(file) {
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed || !Array.isArray(parsed.years)) {
      throw new Error('Файл повреждён или имеет неверный формат');
    }
    await dbClearAll();
    for (const yearRec of parsed.years) {
      if (yearRec && typeof yearRec.year === 'number' && Array.isArray(yearRec.days)) {
        await dbPutYear(yearRec);
      }
    }
    state.yearData = null; // force reload
    await ensureYearLoaded(state.monthCursorYear);
    renderMonthView();
    showToast('Данные восстановлены');
  } catch (err) {
    console.error(err);
    showToast('Ошибка импорта: ' + err.message);
  }
}

$('#btn-export').addEventListener('click', exportAllData);
$('#btn-import').addEventListener('click', () => $('#import-input').click());
$('#import-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) importAllData(file);
  e.target.value = '';
});

/* =========================================================================
   TOAST
   ========================================================================= */

let toastTimer = null;
function showToast(msg) {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('is-open');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('is-open'), 2200);
}

/* =========================================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================================= */

async function init() {
  buildPaletteGrid();
  try {
    await ensureYearLoaded(state.monthCursorYear);
  } catch (err) {
    console.error('Не удалось открыть базу данных:', err);
    showToast('Хранилище недоступно: ' + err.message);
  }
  renderMonthView();
}

init();

</script>
